name: "Bug Report"
description: "File a bug report."
title: "[Bug]: "
labels: ["bug"]
assignees:
  - redwyre
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "Tell us what you see!"
      value: "A bug happened!"
    validations:
      required: true  
  - type: textarea
    id: reproduce
    attributes:
      label: "What happened?"
      description: "Also tell us, what did you expect to happen?"
      placeholder: "Tell us what you see!"
      value: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: "Tell us what you see!"
      value: "This should happen"
    validations:
      required: true  
  - type: upload
    id: screenshots
    attributes:
      label: "Upload screenshots"
      description: "If applicable, add screenshots to help explain your problem."
    validations:
      required: false
  - type: checkboxes
    id: platforms
    attributes:
      label: "Platform"
      options:
        - label: "Mobile"
        - label: "Desktop"
        - label: "Other"
  - type: checkboxes
    id: os
    attributes:
      label: "Operating System"
      options:
        - label: "macOS"
        - label: "iOS"
        - label: "Windows"
        - label: "Android"
        - label: "Linux"
        - label: "Other"
  - type: dropdown
    id: browsers
    attributes:
      label: "What browser are you seeing the problem on?"
      options:
        - "Firefox"
        - "Chrome"
        - "Safari"
        - "Microsoft Edge"
        - "Vivaldi"
        - "Opera"
        - "Opera GX"
        - "Brave"
        - "Other"
